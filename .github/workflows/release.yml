name: Release

# The version always comes from comicsbot/__init__.py (__version__). Three ways to publish:
#   * Actions tab -> Release -> "Run workflow" on main: creates the tag v<version> and the release.
#   * Push a tag like v2.2.0 yourself; it must match comicsbot.__version__.
#   * Publish a release with a new v<version> tag in the GitHub UI; the archives and install
#     instructions are then added to it.
# CI must pass first. Versions with a hyphen (2.2.0-rc1) become pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Determine the tag
        id: tag
        run: |
          version="$(python -c 'import comicsbot; print(comicsbot.__version__)')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
              echo "::error::Run this workflow on the default branch (got $GITHUB_REF)."
              exit 1
            fi
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists. Bump the version in comicsbot/__init__.py and pyproject.toml first."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Build archives
        run: python scripts/build_release.py --expect-version "${{ steps.tag.outputs.tag }}" --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          files=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The release was created in the GitHub UI; attach the archives to it and put the
            # install instructions above its description (once, so re-runs don't repeat them).
            gh release upload "$TAG" "${files[@]}" --clobber
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -q '^## Install' <<< "$body"; then
              { cat dist/RELEASE_NOTES.md; echo; printf '%s\n' "$body"; } > dist/notes.md
              gh release edit "$TAG" --notes-file dist/notes.md
            fi
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              # Creates the tag on the commit that was tested and built.
              flags+=(--target "$GITHUB_SHA")
            else
              flags+=(--verify-tag)
            fi
            gh release create "$TAG" "${files[@]}" --title "ComicsBot ${TAG#v}" \
              --notes-file dist/RELEASE_NOTES.md --generate-notes "${flags[@]}"
          fi
