name: Release

# Push a tag like v2.1.0 (matching comicsbot/__init__.py) to publish a release with
# ready-to-install archives for Linux and Windows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build archives
        run: python scripts/build_release.py --version "${GITHUB_REF_NAME#v}" --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # The release was drafted in the GitHub UI; attach the archives to it.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "ComicsBot $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --generate-notes
          fi
