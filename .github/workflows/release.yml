name: Release

# Publishes the Linux archive, the Windows zip and the Windows setup.exe (Inno Setup).
# The version always comes from comicsbot/__init__.py (__version__). Three ways to publish:
#   * Actions tab -> Release -> "Run workflow" on main: creates the tag v<version> and the release.
#   * Push a tag like v2.2.0 yourself; it must match comicsbot.__version__.
#   * Publish a release with a new v<version> tag in the GitHub UI; the archives and install
#     instructions are then added to it.
# CI must pass first. Versions with a hyphen (2.2.0-rc1) become pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Inno Setup only runs on Windows, so the setup.exe is built here and handed to the release job.
  setup-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Build setup.exe
        shell: pwsh
        run: |
          python scripts/build_release.py --out dist
          ./scripts/build_setup.ps1 -OutDir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-exe
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [test, setup-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Determine the tag
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import comicsbot; print(comicsbot.__version__)')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run this workflow on the default branch (got $GITHUB_REF)."
              exit 1
            fi
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists. Bump the version in comicsbot/__init__.py and pyproject.toml first."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"
      - name: Build archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/build_release.py --expect-version "$TAG" --out dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup-exe
          path: dist
      - name: Checksums for all downloads
        working-directory: dist
        run: |
          test -f "ComicsBot-${TAG#v}-setup.exe"
          sha256sum ComicsBot-*-linux.tar.gz ComicsBot-*-windows.zip ComicsBot-*-setup.exe > SHA256SUMS
          cat SHA256SUMS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          files=(dist/*.tar.gz dist/*.zip dist/*-setup.exe dist/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The release was created in the GitHub UI; attach the archives to it and put the
            # install instructions above its description (once, so re-runs don't repeat them).
            gh release upload "$TAG" "${files[@]}" --clobber
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -q '^## Install' <<< "$body"; then
              { cat dist/RELEASE_NOTES.md; echo; printf '%s\n' "$body"; } > dist/notes.md
              gh release edit "$TAG" --notes-file dist/notes.md
            fi
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              # Creates the tag on the commit that was tested and built.
              flags+=(--target "$GITHUB_SHA")
            else
              flags+=(--verify-tag)
            fi
            gh release create "$TAG" "${files[@]}" --title "ComicsBot ${TAG#v}" \
              --notes-file dist/RELEASE_NOTES.md --generate-notes "${flags[@]}"
          fi
