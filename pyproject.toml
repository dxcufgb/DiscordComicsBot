[project]
name = "discord-comics-bot"
version = "2.3.2"
description = "Discord bot that posts new comic strips from RSS/Atom feeds"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
